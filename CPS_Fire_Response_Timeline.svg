<text x="544.4563106796115" y="475" text-anchor="middle" class="lb b" fill="#ffffff">4.6s</text>
<rect x="660.3495145631067" y="448" width="372.873786407767" height="44" fill="#c75b00"/>
<text x="846.7864077669902" y="475" text-anchor="middle" class="lb b" fill="#ffffff">7.4s</text>
