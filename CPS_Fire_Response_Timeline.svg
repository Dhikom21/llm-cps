<text x="114.68399999999997" y="133.1820895522388" class="lb" fill="#c75b00">sees 0.54 V — its reading</text>
<text x="114.68399999999997" y="151.1820895522388" class="lb" fill="#c75b00">was 4.6 s old, from before</text>
<text x="114.68399999999997" y="169.1820895522388" class="lb" fill="#c75b00">the smoke rose. No action.</text>
<path d="M122.68399999999997,179.1820895522388 C134.68399999999997,206.11940298507463 345.12,255.85074626865674 396.4,290.9910447761194" fill="none" stroke="#c75b00" stroke-width="1.3"/>
