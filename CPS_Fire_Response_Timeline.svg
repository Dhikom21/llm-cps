<text x="1083.6116504854367" y="475" text-anchor="middle" class="lb b" fill="#ffffff">2.0s</text>
<line x1="262.28155339805824" y1="494" x2="262.28155339805824" y2="501" stroke="#1a5fb4"/>
<text x="262.28155339805824" y="512" text-anchor="middle" class="ax" fill="#1a5fb4">waiting for the next sensor publish</text>
<line x1="544.4563106796115" y1="494" x2="544.4563106796115" y2="519" stroke="#6aa3dd"/>
<text x="544.4563106796115" y="530" text-anchor="middle" class="ax" fill="#6aa3dd">reading already stale when used</text>
<line x1="846.7864077669902" y1="494" x2="846.7864077669902" y2="501" stroke="#c75b00"/>
<text x="846.7864077669902" y="512" text-anchor="middle" class="ax" fill="#c75b00">waiting for the next agent cycle</text>
<line x1="1083.6116504854367" y1="494" x2="1083.6116504854367" y2="519" stroke="#1b7f4c"/>
<text x="1083.6116504854367" y="530" text-anchor="middle" class="ax" fill="#1b7f4c">model inference</text>
<text x="96" y="570" class="lb b">The model accounts for 10% of the delay. The other 90% is how often the system looks.</text>
<text x="96" y="590" class="ax">Sensor period 5 s plus 1.5 s of DS18B20 conversion = 6.6 s actual · agent cycle 10 s · inference median 2.0 s</text>
<text x="96" y="609" class="ax">The agent never observed the fire below 2.42 V, so it could not have reacted to the rise — only to the peak.</text>
