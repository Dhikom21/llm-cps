<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1010" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1a5fb4"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1b7f4c"/></marker>
    <marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c75b00"/></marker>
    <marker id="aP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c3fa8"/></marker>
    <marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#78909c"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c62828"/></marker>
  </defs>
  <style>
    .t{font-size:13.5px;font-weight:700;fill:#0f2d54}
    .s{font-size:10.5px;fill:#5b6b7a}
    .box{fill:#ffffff;stroke:#b9c6d4;stroke-width:1.6}
    .grp{fill:#fbfcfd;stroke:#c7ced6;stroke-width:1.6;stroke-dasharray:7 5}
    .h{font-size:10.5px;font-weight:700;letter-spacing:1.3px;fill:#8a99a8}
    .l{font-size:10px;fill:#37474f}
    .wB{stroke:#1a5fb4;stroke-width:2.1;fill:none;marker-end:url(#aB)}
    .wG{stroke:#1b7f4c;stroke-width:2.3;fill:none;marker-end:url(#aG)}
    .wO{stroke:#c75b00;stroke-width:2.1;fill:none;marker-end:url(#aO)}
    .wP{stroke:#6c3fa8;stroke-width:1.8;fill:none;marker-end:url(#aP);stroke-dasharray:7 4}
    .wK{stroke:#78909c;stroke-width:1.8;fill:none;marker-end:url(#aK)}
    .wR{stroke:#c62828;stroke-width:2.3;fill:none;marker-end:url(#aR)}
  </style>

  <text x="690" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f2d54">Autonomous CPS — five processes on one Raspberry Pi</text>
  <text x="690" y="56" text-anchor="middle" font-size="12.5" fill="#5b6b7a">Each process has one job. They share nothing but a message broker.</text>

  <!-- ===== PHYSICAL ===== -->
  <text x="36" y="92" class="h">PHYSICAL</text>
  <rect x="34" y="102" width="188" height="330" rx="10" class="grp"/>
  <rect x="48" y="126" width="160" height="50" rx="7" class="box" fill="#e8f5e9"/>
  <text x="128" y="147" text-anchor="middle" class="t" font-size="12">DS18B20 ×2</text>
  <text x="128" y="164" text-anchor="middle" class="s">1-Wire, GPIO4</text>

  <rect x="48" y="300" width="160" height="50" rx="7" class="box" fill="#ffebee"/>
  <text x="128" y="321" text-anchor="middle" class="t" font-size="12">Grove relay</text>
  <text x="128" y="338" text-anchor="middle" class="s">GPIO17 → heater</text>

  <rect x="48" y="360" width="160" height="50" rx="7" class="box" fill="#ffebee"/>
  <text x="128" y="381" text-anchor="middle" class="t" font-size="12">Piezo buzzer</text>
  <text x="128" y="398" text-anchor="middle" class="s">GPIO27, PWM</text>

  <text x="128" y="200" text-anchor="middle" class="s">one 4.7 k pull-up</text>
  <text x="128" y="216" text-anchor="middle" class="s">for the whole bus</text>

  <!-- ===== SENSOR + ACTUATOR PROCESSES ===== -->
  <text x="252" y="92" class="h">OWN THE HARDWARE</text>
  <rect x="250" y="102" width="212" height="140" rx="9" class="box" fill="#f7f9fb"/>
  <text x="356" y="128" text-anchor="middle" class="t">pi_sensor.py</text>
  <text x="356" y="146" text-anchor="middle" class="s">reads the 1-Wire bus</text>
  <text x="356" y="162" text-anchor="middle" class="s">reads smoke from the twin</text>
  <text x="356" y="178" text-anchor="middle" class="s">publishes · decides nothing</text>
  <text x="356" y="206" text-anchor="middle" class="s" font-style="italic">knows nothing of BuildSim,</text>
  <text x="356" y="221" text-anchor="middle" class="s" font-style="italic">the database or the agent</text>

  <rect x="250" y="268" width="212" height="164" rx="9" class="box" fill="#fff8ed"/>
  <text x="356" y="294" text-anchor="middle" class="t">pi_actuator.py</text>
  <text x="356" y="312" text-anchor="middle" class="s">the only owner of the pins</text>
  <rect x="266" y="324" width="180" height="46" rx="6" fill="#ffffff" stroke="#c75b00" stroke-width="1.6"/>
  <text x="356" y="343" text-anchor="middle" class="t" font-size="12" fill="#c75b00">pi_guard — the shield</text>
  <text x="356" y="360" text-anchor="middle" class="s">H1 · H2 · H4 · H5 · NOOP</text>
  <text x="356" y="390" text-anchor="middle" class="s">fail-safe: all off after 180 s</text>
  <text x="356" y="406" text-anchor="middle" class="s">with no command</text>

  <path d="M208,146 L246,134" class="wG"/>
  <path d="M246,330 L212,318" class="wG"/>
  <path d="M246,350 L212,378" class="wG"/>

  <!-- ===== BROKER ===== -->
  <rect x="508" y="150" width="150" height="246" rx="10" class="box" fill="#e8f0fb"/>
  <text x="583" y="186" text-anchor="middle" class="t" font-size="15">MQTT</text>
  <text x="583" y="206" text-anchor="middle" class="s">Mosquitto, :1883</text>
  <text x="583" y="246" text-anchor="middle" class="l" font-weight="700">sensors/#</text>
  <text x="583" y="263" text-anchor="middle" class="l" font-weight="700">actuators/#</text>
  <text x="583" y="280" text-anchor="middle" class="l" font-weight="700">commands/#</text>
  <text x="583" y="297" text-anchor="middle" class="l" font-weight="700">results/#</text>
  <text x="583" y="336" text-anchor="middle" class="s">nobody knows</text>
  <text x="583" y="351" text-anchor="middle" class="s">who else is here</text>
  <text x="583" y="375" text-anchor="middle" class="s">mosquitto_sub -t '#'</text>

  <path d="M462,160 L504,200" class="wB"/>
  <text x="452" y="146" class="l" fill="#1a5fb4">readings</text>
  <path d="M462,296 L504,286" class="wB"/>
  <text x="452" y="268" class="l" fill="#1a5fb4">states</text>
  <path d="M504,318 L462,330" class="wR"/>
  <text x="452" y="430" class="l" fill="#c62828">commands in</text>

  <!-- ===== SUBSCRIBERS ===== -->
  <text x="706" y="92" class="h">SUBSCRIBERS — each one just listens</text>

  <rect x="704" y="102" width="238" height="78" rx="9" class="box"/>
  <text x="823" y="128" text-anchor="middle" class="t">pi_consumer.py</text>
  <text x="823" y="146" text-anchor="middle" class="s">subscribes sensors/#</text>
  <text x="823" y="163" text-anchor="middle" class="s">writes every reading down</text>

  <rect x="704" y="196" width="238" height="78" rx="9" class="box"/>
  <text x="823" y="222" text-anchor="middle" class="t">pi_twin_bridge.py</text>
  <text x="823" y="240" text-anchor="middle" class="s">sensors/# and actuators/#</text>
  <text x="823" y="257" text-anchor="middle" class="s">the only thing that knows BuildSim</text>

  <rect x="704" y="290" width="238" height="78" rx="9" class="box" fill="#f2edfa"/>
  <text x="823" y="316" text-anchor="middle" class="t">evacuate.py</text>
  <text x="823" y="334" text-anchor="middle" class="s">subscribes sensors/#</text>
  <text x="823" y="351" text-anchor="middle" class="s">people · routes · alerts</text>

  <rect x="704" y="384" width="238" height="78" rx="9" class="box" fill="#fff8ed"/>
  <text x="823" y="410" text-anchor="middle" class="t">monitor.py</text>
  <text x="823" y="428" text-anchor="middle" class="s">reads the twin independently</text>
  <text x="823" y="445" text-anchor="middle" class="s">checks the spec as it runs</text>

  <path d="M660,200 L700,146" class="wB"/>
  <path d="M660,240 L700,232" class="wB"/>
  <path d="M660,290 L700,326" class="wB"/>

  <!-- ===== STORE ===== -->
  <rect x="988" y="102" width="180" height="78" rx="9" class="box" fill="#eceff1"/>
  <text x="1078" y="130" text-anchor="middle" class="t">SQLite</text>
  <text x="1078" y="148" text-anchor="middle" class="s">pi_readings.sqlite</text>
  <text x="1078" y="165" text-anchor="middle" class="s">the past</text>
  <path d="M944,140 L984,140" class="wB"/>

  <!-- ===== TWIN ===== -->
  <rect x="988" y="196" width="358" height="266" rx="10" class="box" fill="#f7f9fb"/>
  <text x="1167" y="222" text-anchor="middle" class="t">BuildSim — the digital twin</text>
  <text x="1167" y="239" text-anchor="middle" class="s">REST :9090 · in memory · speaks no MQTT</text>

  <rect x="1004" y="252" width="160" height="46" rx="6" class="box"/>
  <text x="1084" y="271" text-anchor="middle" class="l" font-weight="700">sensors + actuators</text>
  <text x="1084" y="288" text-anchor="middle" class="s">live values on the plan</text>

  <rect x="1174" y="252" width="158" height="46" rx="6" class="box"/>
  <text x="1253" y="271" text-anchor="middle" class="l" font-weight="700">smoke</text>
  <text x="1253" y="288" text-anchor="middle" class="s">written by inject_fire.py</text>

  <rect x="1004" y="308" width="160" height="46" rx="6" class="box"/>
  <text x="1084" y="327" text-anchor="middle" class="l" font-weight="700">effects</text>
  <text x="1084" y="344" text-anchor="middle" class="s">fire and smoke plumes</text>

  <rect x="1174" y="308" width="158" height="46" rx="6" class="box"/>
  <text x="1253" y="327" text-anchor="middle" class="l" font-weight="700">routes + occupants</text>
  <text x="1253" y="344" text-anchor="middle" class="s">locked doors excluded</text>

  <rect x="1004" y="364" width="328" height="42" rx="6" class="box"/>
  <text x="1168" y="382" text-anchor="middle" class="l" font-weight="700">alerts</text>
  <text x="1168" y="398" text-anchor="middle" class="s">fire-* from evacuate · spec-* from monitor</text>

  <text x="1167" y="432" text-anchor="middle" class="s">state is in memory — a restart empties the floor plan</text>
  <text x="1167" y="448" text-anchor="middle" class="s">until the bridge and the actuator re-register</text>

  <path d="M944,234 L984,252" class="wB"/>
  <text x="946" y="212" class="l" fill="#1a5fb4">HTTP PUT</text>
  <path d="M944,340 L984,330" class="wP"/>
  <path d="M988,400 L946,418" class="wP"/>

  <!-- smoke back to the sensor process: the one inbound arrow -->
  <path d="M1253,300 L1253,512 L236,512 L236,196 L246,196" class="wR" stroke-dasharray="6 4" fill="none"/>
  <text x="690" y="504" text-anchor="middle" class="l" fill="#c62828">GET smoke — the only value that flows INTO the system</text>

  <!-- ===== AGENT ===== -->
  <text x="252" y="560" class="h">THE DECISION — holds no hardware at all</text>
  <rect x="250" y="570" width="692" height="178" rx="10" class="box" fill="#f7f9fb"/>
  <text x="596" y="596" text-anchor="middle" class="t" font-size="15">llm_edge_agent.py</text>

  <rect x="272" y="610" width="200" height="56" rx="7" class="box" fill="#e8f0fb"/>
  <text x="372" y="632" text-anchor="middle" class="t" font-size="12">1 · PERCEIVE</text>
  <text x="372" y="650" text-anchor="middle" class="s">present from the bus</text>

  <rect x="492" y="610" width="200" height="56" rx="7" class="box" fill="#e8f0fb"/>
  <text x="592" y="632" text-anchor="middle" class="t" font-size="12">2 · REASON</text>
  <text x="592" y="650" text-anchor="middle" class="s">tools, up to 5 hops</text>

  <rect x="712" y="610" width="208" height="56" rx="7" class="box" fill="#ffebee"/>
  <text x="816" y="632" text-anchor="middle" class="t" font-size="12">3 · ASK</text>
  <text x="816" y="650" text-anchor="middle" class="s">publish a command</text>

  <path d="M472,638 L488,638" class="wB"/>
  <path d="M692,638 L708,638" class="wB"/>

  <text x="596" y="694" text-anchor="middle" class="s">read_sensors · query_history · turn_on · turn_off · create_alert</text>
  <text x="596" y="716" text-anchor="middle" class="s" font-style="italic">it cannot drive a pin — it can only ask, and be refused</text>
  <text x="596" y="736" text-anchor="middle" class="s">past from SQLite · present from the bus</text>

  <path d="M560,400 L420,604" class="wB"/>
  <text x="432" y="540" class="l" fill="#1a5fb4">readings + states</text>

  <path d="M1078,184 L1078,190 L966,190 L966,660 L946,660" class="wB" fill="none"/>
  <text x="962" y="556" class="l" fill="#1a5fb4" text-anchor="end">recent · trend · SQL</text>

  <path d="M816,604 L816,530 L640,530 L600,402" class="wR" fill="none"/>
  <text x="728" y="522" text-anchor="middle" class="l" fill="#c62828">commands/{room}/{actuator}</text>

  <!-- ===== MODEL ===== -->
  <rect x="988" y="570" width="358" height="78" rx="9" class="box" fill="#eceff1"/>
  <text x="1167" y="598" text-anchor="middle" class="t">the model</text>
  <text x="1167" y="616" text-anchor="middle" class="s">canopus.eislab.se/v1 · OpenAI-compatible</text>
  <text x="1167" y="633" text-anchor="middle" class="s">proposes; never trusted</text>
  <path d="M946,620 L984,612" class="wO"/>
  <path d="M984,632 L946,640" class="wO"/>

  <!-- ===== INJECTOR + VIEWER ===== -->
  <rect x="988" y="676" width="172" height="72" rx="9" class="box" fill="#f2edfa"/>
  <text x="1074" y="702" text-anchor="middle" class="t" font-size="12">inject_fire.py</text>
  <text x="1074" y="719" text-anchor="middle" class="s">writes smoke into</text>
  <text x="1074" y="734" text-anchor="middle" class="s">the twin</text>
  <path d="M1074,672 L1074,466" class="wP"/>

  <rect x="1174" y="676" width="172" height="72" rx="9" class="box" fill="#eceff1"/>
  <text x="1260" y="702" text-anchor="middle" class="t" font-size="12">laptop browser</text>
  <text x="1260" y="719" text-anchor="middle" class="s">192.168.1.45:9090</text>
  <text x="1260" y="734" text-anchor="middle" class="s">REST + WebSocket</text>
  <path d="M1260,672 L1260,466" class="wK"/>

  <!-- ===== LEGEND ===== -->
  <rect x="34" y="776" width="1312" height="212" rx="10" fill="#f7f9fb" stroke="#c7ced6"/>
  <text x="58" y="802" class="t">How to read it</text>

  <line x1="60" y1="824" x2="106" y2="824" stroke="#1b7f4c" stroke-width="2.6"/>
  <text x="118" y="828" class="l"><tspan font-weight="700">green</tspan> — wires. The only part that is physical, and the only part with no network in it.</text>

  <line x1="60" y1="848" x2="106" y2="848" stroke="#1a5fb4" stroke-width="2.6"/>
  <text x="118" y="852" class="l"><tspan font-weight="700">blue</tspan> — facts travelling outward: readings, stored values, actuator states.</text>

  <line x1="700" y1="824" x2="746" y2="824" stroke="#c62828" stroke-width="2.6"/>
  <text x="758" y="828" class="l"><tspan font-weight="700">red</tspan> — requests travelling inward: the agent asking, and smoke being read in.</text>

  <line x1="700" y1="848" x2="746" y2="848" stroke="#6c3fa8" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="758" y="852" class="l"><tspan font-weight="700">purple</tspan> — processes that observe or inject, and never control.</text>

  <text x="60" y="886" class="l" font-weight="700">The three claims this diagram makes</text>
  <text x="60" y="908" class="l">1.  The shield sits in <tspan font-weight="700">pi_actuator.py</tspan>, a different process from the model. No fault in the agent can switch a relay this process declines to switch.</text>
  <text x="60" y="930" class="l">2.  Every box on the right is a <tspan font-weight="700">subscriber</tspan>. The twin is not a special case written into other programs — it consumes the same stream as the database.</text>
  <text x="60" y="952" class="l">3.  Only <tspan font-weight="700">pi_sensor.py</tspan> knows where a reading comes from. Temperature arrives from a chip, smoke from a simulation; downstream they are indistinguishable.</text>
  <text x="60" y="976" class="s">Cost, stated honestly: the broker is now on the control path. It runs on the Pi's own localhost, and pi_actuator.py switches everything off after 180 s without a command.</text>
</svg>
