<text x="655.3" y="135.9" text-anchor="middle" class="big" fill="#1a5fb4">sensor warmed by hand</text>
<text x="1000" y="314.2857142857144" class="big" fill="#1a5fb4">A109</text>
<text x="92" y="406" class="big" fill="#0f2d54">Both answers land inside one agent cycle. The bus is not the bottleneck — the time until the next decision is.</text>
<text x="92" y="430" class="lb">Four crossings across both rooms: 6.1 s, 9.4 s, 11.6 s, 12.8 s (median 11.6 s). The reading used was 3.3–4.6 s old each time.</text>
<text x="92" y="452" class="lb">The clock starts at the first out-of-band publish, so one sensor period (6.6 s) of sensing delay sits before it, uncounted: about 15 s end to end.</text>
