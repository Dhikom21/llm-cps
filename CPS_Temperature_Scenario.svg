<text x="762.0075757575758" y="135.16949152542364" text-anchor="end" class="big" fill="#c62828">too hot — heaters OFF</text>
<text x="762.0075757575758" y="157.7457627118644" text-anchor="end" class="lb" fill="#c62828">27.6 °C, over the 25 °C ceiling</text>
<text x="1008" y="135.16949152542364" text-anchor="end" class="big" fill="#546e7a">cooling back down</text>
<text x="1008" y="227.35593220338973" text-anchor="end" class="big" fill="#1b7f4c">back under 24 °C</text>
<text x="1008" y="246.16949152542367" text-anchor="end" class="lb" fill="#1b7f4c">heaters ON again</text>
<text x="386.3484848484848" y="335.72203389830514" text-anchor="middle" class="big" fill="#1a5fb4">heaters on, slowly climbing</text>
<text x="86" y="416" class="big" fill="#0f2d54">A closed loop: the command changes the temperature, and the temperature changes the next command.</text>
<text x="86" y="440" class="lb">Heaters on below 24 °C → both rooms pass 25 °C → the agent switches them off → four minutes of cooling → back under 24 °C → on again.</text>
<text x="86" y="462" class="lb">All three decisions shown were the model's. A108 is a virtual room, so its temperature is simulated.</text>
