# Grafana for the D7065E CPS dashboard.
# Separate compose file so your existing docker-compose.yml is untouched.
# It reads the SAME TimescaleDB (via the host's published port 5432).
#
# Run from this folder:
#     docker compose -f docker-compose.grafana.yml up -d
# Then open http://localhost:3001  (anonymous admin — no login needed)

services:
  grafana:
    image: grafana/grafana:latest
    container_name: d7065e_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./provisioning:/etc/grafana/provisioning
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
