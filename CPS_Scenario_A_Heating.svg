<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#37474F"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#EF6C00"/></marker>
  </defs>
  <text x="580" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1B5E20">Scenario A — Real heating control loop (live on the Raspberry Pi)</text>
  <text x="580" y="56" text-anchor="middle" font-size="13" fill="#555">A real closed loop: the agent reads a real sensor and switches a real heater. Nothing is simulated.</text>

  <!-- number badge helper drawn inline -->
  <!-- TOP: data path -->
  <rect x="420" y="86" width="330" height="82" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.8"/>
  <text x="585" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0D47A1">Edge agent → MQTT → TimescaleDB</text>
  <text x="585" y="138" text-anchor="middle" font-size="11.5" fill="#444">(on Kubernetes: broker, consumer, database)</text>
  <text x="585" y="156" text-anchor="middle" font-size="11" fill="#777">the reading is published and stored</text>

  <!-- LEFT: sensor -->
  <rect x="60" y="215" width="250" height="92" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/>
  <text x="185" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">DS18B20 sensor</text>
  <text x="185" y="273" text-anchor="middle" font-size="12" fill="#444">real room temperature</text>
  <text x="185" y="292" text-anchor="middle" font-size="11" fill="#777">the "eyes"</text>

  <!-- RIGHT: agent -->
  <rect x="860" y="215" width="250" height="92" rx="10" fill="#EDE7F6" stroke="#6A1B9A" stroke-width="2"/>
  <text x="985" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#4A148C">LLM Agent</text>
  <text x="985" y="271" text-anchor="middle" font-size="12" fill="#444">perceive → decide</text>
  <text x="985" y="290" text-anchor="middle" font-size="11" fill="#777">the "brain"</text>

  <!-- BOTTOM: heater -->
  <rect x="420" y="360" width="330" height="92" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/>
  <text x="585" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">Relay → Heater</text>
  <text x="585" y="418" text-anchor="middle" font-size="12" fill="#444">real actuator (lamp / heater)</text>
  <text x="585" y="437" text-anchor="middle" font-size="11" fill="#777">the "hand"</text>

  <!-- Arrows clockwise -->
  <!-- 1 sensor -> data -->
  <path d="M250,215 L470,168" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="352" cy="182" r="13" fill="#1565C0"/><text x="352" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="300" y="205" font-size="11" fill="#37474F">publish reading (MQTT)</text>
  <!-- 2 data -> agent -->
  <path d="M700,168 L905,213" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="815" cy="184" r="13" fill="#1565C0"/><text x="815" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="760" y="205" font-size="11" fill="#37474F">read_sensors (perceive)</text>
  <!-- 3 agent -> heater -->
  <path d="M905,307 L720,372" fill="none" stroke="#6A1B9A" stroke-width="2.2" marker-end="url(#a)"/>
  <circle cx="820" cy="343" r="13" fill="#6A1B9A"/><text x="820" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="742" y="333" font-size="11" fill="#6A1B9A">decide → set_actuator (relay on/off)</text>
  <!-- 4 heater -> sensor (physical) -->
  <path d="M420,415 L250,300" fill="none" stroke="#EF6C00" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#ao)"/>
  <circle cx="330" cy="360" r="13" fill="#EF6C00"/><text x="330" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="250" y="385" font-size="11" fill="#EF6C00">physical: heat → temperature</text>

  <!-- center caption -->
  <text x="585" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#888">CLOSED</text>
  <text x="585" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#888">LOOP</text>
</svg>
