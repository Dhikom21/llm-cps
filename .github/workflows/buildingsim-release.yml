name: BuildSim release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buildingsim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: buildingsim/go.sum
      - name: Build binaries and checksums
        run: make checksums VERSION="${GITHUB_REF_NAME:-manual}"
      - uses: actions/upload-artifact@v4
        with:
          name: buildingsim-binaries
          path: buildingsim/dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
