<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#E65100"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#37474F"/></marker>
  </defs>
  <style>
    .lbl{font-size:12.5px;fill:#263238;}
    .sm{font-size:11px;fill:#546E7A;}
    .bold{font-weight:700;}
  </style>

  <text x="610" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1A237E">Using your existing monitor with the Raspberry Pi</text>
  <text x="610" y="56" text-anchor="middle" font-size="13" fill="#555">Both machines stay connected — you switch the monitor's input to flip between them.</text>

  <!-- ================= Raspberry Pi board ================= -->
  <rect x="70" y="180" width="360" height="240" rx="10" fill="#1B5E20" stroke="#0B3D10" stroke-width="2"/>
  <text x="250" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#A5D6A7">Raspberry Pi 5</text>
  <text x="250" y="332" text-anchor="middle" font-size="11" fill="#81C784">(GPIO header along the top edge)</text>

  <!-- GPIO header -->
  <rect x="100" y="188" width="300" height="20" rx="3" fill="#212121"/>
  <text x="250" y="203" text-anchor="middle" font-size="10" fill="#BDBDBD">40-pin GPIO (sensors go here)</text>

  <!-- bottom long edge: power + 2x micro HDMI -->
  <rect x="110" y="408" width="38" height="22" rx="3" fill="#90A4AE"/>
  <text x="129" y="452" text-anchor="middle" class="sm">USB-C</text>
  <text x="129" y="466" text-anchor="middle" class="sm">power</text>

  <rect x="190" y="408" width="30" height="22" rx="3" fill="#FF7043"/>
  <text x="205" y="452" text-anchor="middle" class="sm bold" fill="#E65100">micro</text>
  <text x="205" y="466" text-anchor="middle" class="sm bold" fill="#E65100">HDMI 0</text>

  <rect x="248" y="408" width="30" height="22" rx="3" fill="#FFAB91"/>
  <text x="263" y="452" text-anchor="middle" class="sm">micro</text>
  <text x="263" y="466" text-anchor="middle" class="sm">HDMI 1</text>

  <!-- right short edge: USB + ethernet -->
  <rect x="428" y="210" width="26" height="42" rx="3" fill="#1E88E5"/>
  <rect x="428" y="262" width="26" height="42" rx="3" fill="#546E7A"/>
  <rect x="428" y="326" width="26" height="40" rx="3" fill="#455A64"/>
  <text x="470" y="228" class="sm bold">USB 3.0 ×2</text>
  <text x="470" y="246" class="sm" fill="#1565C0">← keyboard here</text>
  <text x="470" y="288" class="sm">USB 2.0 ×2</text>
  <text x="470" y="350" class="sm">Ethernet</text>

  <!-- microSD -->
  <rect x="62" y="360" width="14" height="30" rx="2" fill="#FFD54F"/>
  <text x="40" y="410" class="sm" text-anchor="middle">microSD</text>
  <text x="40" y="424" class="sm" text-anchor="middle">(underside)</text>

  <!-- ================= Monitor ================= -->
  <rect x="760" y="150" width="400" height="240" rx="8" fill="#263238" stroke="#102027" stroke-width="3"/>
  <rect x="775" y="165" width="370" height="200" rx="3" fill="#37474F"/>
  <text x="960" y="275" text-anchor="middle" font-size="15" fill="#B0BEC5">your existing monitor</text>
  <rect x="930" y="390" width="60" height="40" fill="#37474F"/>
  <rect x="880" y="430" width="160" height="12" rx="4" fill="#455A64"/>

  <!-- input source button -->
  <circle cx="1130" cy="372" r="7" fill="#90A4AE"/>
  <text x="1152" y="376" class="sm bold" text-anchor="start">Input /</text>
  <text x="1152" y="390" class="sm bold" text-anchor="start">Source</text>

  <!-- back panel callout -->
  <rect x="720" y="470" width="440" height="140" rx="9" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="1.5"/>
  <text x="740" y="494" class="lbl bold" fill="#263238">Monitor back panel — the inputs</text>
  <rect x="744" y="508" width="26" height="16" rx="2" fill="#78909C"/>
  <text x="782" y="521" class="lbl">HDMI 1  →  already used by your laptop / dock</text>
  <rect x="744" y="536" width="26" height="16" rx="2" fill="#FF7043"/>
  <text x="782" y="549" class="lbl bold" fill="#E65100">HDMI 2  →  plug the Pi in here</text>
  <rect x="744" y="564" width="26" height="16" rx="2" fill="#78909C"/>
  <text x="782" y="577" class="lbl">DisplayPort  →  (spare)</text>
  <text x="740" y="600" class="sm">If every input is taken, unplug the dock's cable while you use the Pi.</text>

  <!-- ================= the HDMI cable ================= -->
  <path d="M205,430 C205,560 430,600 730,545" fill="none" stroke="#E65100" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="330" y="596" width="270" height="46" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="465" y="615" text-anchor="middle" class="lbl bold" fill="#E65100">micro-HDMI → HDMI cable</text>
  <text x="465" y="633" text-anchor="middle" class="sm" fill="#BF360C">the one part you may need to borrow</text>

  <!-- ================= keyboard ================= -->
  <rect x="560" y="200" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5"/>
  <g fill="#CFD8DC">
    <rect x="570" y="210" width="16" height="10" rx="2"/><rect x="590" y="210" width="16" height="10" rx="2"/>
    <rect x="610" y="210" width="16" height="10" rx="2"/><rect x="630" y="210" width="16" height="10" rx="2"/>
    <rect x="650" y="210" width="16" height="10" rx="2"/><rect x="670" y="210" width="16" height="10" rx="2"/>
    <rect x="570" y="226" width="36" height="10" rx="2"/><rect x="612" y="226" width="64" height="10" rx="2"/>
    <rect x="580" y="242" width="110" height="10" rx="2"/>
  </g>
  <text x="635" y="278" text-anchor="middle" class="lbl bold">USB keyboard + mouse</text>
  <text x="635" y="295" text-anchor="middle" class="sm">move the cable / wireless dongle</text>
  <text x="635" y="310" text-anchor="middle" class="sm">from the dock into the Pi's USB port</text>
  <path d="M556,230 L462,230" fill="none" stroke="#1E88E5" stroke-width="3" marker-end="url(#ag)"/>

  <!-- ================= steps ================= -->
  <rect x="60" y="660" width="1100" height="120" rx="10" fill="#F7F9FB" stroke="#C7CED6"/>
  <text x="80" y="686" class="lbl bold" font-size="14" fill="#1A237E">Order to do it in</text>
  <text x="80" y="710" class="lbl"><tspan class="bold">1.</tspan>  Pi powered OFF.  <tspan class="bold">2.</tspan>  micro-HDMI end into the Pi's <tspan class="bold">HDMI 0</tspan>, other end into the monitor's free <tspan class="bold">HDMI 2</tspan>.</text>
  <text x="80" y="732" class="lbl"><tspan class="bold">3.</tspan>  Move the keyboard/mouse USB into a Pi USB port.  <tspan class="bold">4.</tspan>  Plug in the Pi's USB-C power (this boots it).</text>
  <text x="80" y="754" class="lbl"><tspan class="bold">5.</tspan>  Press the monitor's <tspan class="bold">Input / Source</tspan> button and choose HDMI 2 — you'll see the Pi desktop. Press it again to go back to your laptop.</text>
</svg>
