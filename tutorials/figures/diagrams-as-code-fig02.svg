<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Ventilation control container architecture</title>
  <desc id="desc">A system boundary contains sensor, history, autonomous decider and actuator services. BuildSim provides sensor state to the sensor service; the decider commands the actuator service; the actuator service applies state to BuildSim.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#183b66"/>
    </marker>
    <style>
      .box{fill:#e8f3ff;stroke:#183b66;stroke-width:2}
      .boundary{fill:#f8fbff;stroke:#54789f;stroke-width:2.5;stroke-dasharray:10 8}
      .external{fill:#c8f0ea;stroke:#17675d;stroke-width:2.5}
      .store{fill:#eee8ff;stroke:#59458a;stroke-width:2}
      .edge{fill:none;stroke:#183b66;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font:600 19px system-ui,sans-serif;fill:#102a43;text-anchor:middle}
      .small{font:15px system-ui,sans-serif;fill:#486581;text-anchor:middle}
      .edge-label{font:14px system-ui,sans-serif;fill:#334e68;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5}
      .heading{font:700 22px system-ui,sans-serif;fill:#102a43}
    </style>
  </defs>

  <rect class="boundary" x="30" y="35" width="880" height="450" rx="18"/>
  <text class="heading" x="58" y="72">Ventilation Control · system boundary</text>

  <rect class="box" x="75" y="135" width="190" height="95" rx="12"/>
  <text class="label" x="170" y="175">Sensor service</text>
  <text class="small" x="170" y="202">observes + publishes</text>

  <path class="store" d="M330 150c0-18 190-18 190 0v82c0 18-190 18-190 0z"/>
  <path d="M330 150c0 18 190 18 190 0" fill="none" stroke="#59458a" stroke-width="2"/>
  <text class="label" x="425" y="181">History</text>
  <text class="small" x="425" y="208">readings + evidence</text>

  <rect class="box" x="330" y="330" width="190" height="95" rx="12"/>
  <text class="label" x="425" y="370">Autonomous decider</text>
  <text class="small" x="425" y="397">proposes a command</text>

  <rect class="box" x="650" y="330" width="210" height="95" rx="12"/>
  <text class="label" x="755" y="370">Actuator service</text>
  <text class="small" x="755" y="397">validates + applies</text>

  <rect class="external" x="970" y="218" width="190" height="105" rx="12"/>
  <text class="label" x="1065" y="261">BuildSim</text>
  <text class="small" x="1065" y="289">external shared state</text>

  <path class="edge" d="M265 182H326"/>
  <text class="edge-label" x="296" y="167">store</text>
  <path class="edge" d="M425 248V326"/>
  <text class="edge-label" x="472" y="292">query</text>
  <path class="edge" d="M520 377H646"/>
  <text class="edge-label" x="583" y="361">command</text>
  <path class="edge" d="M970 245H900V112H170V131"/>
  <text class="edge-label" x="708" y="101">read sensor state · REST</text>
  <path class="edge" d="M860 377H930V297H966"/>
  <text class="edge-label" x="925" y="358">apply state · REST</text>
</svg>
