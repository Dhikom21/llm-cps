<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#c62828"/>
    </marker>
    <marker id="arrK" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#37474F"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#1565c0"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:13.5px;fill:#263238}
    .sm{font-size:11.5px;fill:#546E7A}
    .b{font-weight:700}
    .hd{font-size:15px;font-weight:700;fill:#0f2d54}
  </style>

  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f2d54">Wiring the bulb through the relay</text>
  <text x="590" y="57" text-anchor="middle" font-size="13" fill="#555">The relay is just a switch in the middle of the positive wire. It is not connected to the bulb circuit's power in any way.</text>

  <!-- ================= CLOSE-UP of a screw terminal ================= -->
  <rect x="40" y="90" width="480" height="300" rx="10" fill="#F7F9FB" stroke="#C7CED6" stroke-width="1.5"/>
  <text x="62" y="118" class="hd">What a "screw terminal" is</text>

  <!-- terminal block body -->
  <rect x="120" y="175" width="300" height="120" rx="8" fill="#1B5E20" stroke="#0B3D10" stroke-width="2"/>
  <!-- two screws -->
  <circle cx="195" cy="205" r="22" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
  <rect x="181" y="202" width="28" height="6" rx="2" fill="#546E7A"/>
  <circle cx="345" cy="205" r="22" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
  <rect x="331" y="202" width="28" height="6" rx="2" fill="#546E7A"/>
  <text x="195" y="163" text-anchor="middle" class="sm b">screw 1</text>
  <text x="345" y="163" text-anchor="middle" class="sm b">screw 2</text>

  <!-- wire openings on the front face -->
  <rect x="172" y="255" width="46" height="26" rx="4" fill="#0B3D10"/>
  <rect x="322" y="255" width="46" height="26" rx="4" fill="#0B3D10"/>
  <text x="195" y="318" text-anchor="middle" class="sm">hole 1</text>
  <text x="345" y="318" text-anchor="middle" class="sm">hole 2</text>

  <!-- a wire going into hole 1 -->
  <path d="M60,268 L172,268" stroke="#c62828" stroke-width="7" stroke-linecap="round"/>
  <path d="M150,268 L196,268" stroke="#d8c08a" stroke-width="4" stroke-linecap="round"/>
  <text x="60" y="250" class="sm">bare copper end</text>
  <text x="60" y="296" class="sm">pushed into the hole</text>

  <text x="62" y="352" class="lbl"><tspan class="b">1.</tspan> Turn the screw anticlockwise a few turns — this opens the clamp inside.</text>
  <text x="62" y="372" class="lbl"><tspan class="b">2.</tspan> Push the wire into the hole below it.  <tspan class="b">3.</tspan> Tighten the screw. Tug the wire to check.</text>

  <!-- ================= THE CIRCUIT ================= -->
  <rect x="545" y="90" width="595" height="300" rx="10" fill="#F7F9FB" stroke="#C7CED6" stroke-width="1.5"/>
  <text x="567" y="118" class="hd">The bulb circuit — one loop, broken by the relay</text>

  <!-- 5V supply -->
  <rect x="580" y="170" width="120" height="120" rx="8" fill="#37474F"/>
  <text x="640" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#ECEFF1">5 V</text>
  <text x="640" y="242" text-anchor="middle" class="sm" fill="#B0BEC5">supply</text>
  <text x="640" y="262" text-anchor="middle" class="sm" fill="#B0BEC5">(USB charger)</text>
  <circle cx="700" cy="196" r="6" fill="#c62828"/><text x="712" y="200" class="sm b" fill="#c62828">+</text>
  <circle cx="700" cy="266" r="6" fill="#263238"/><text x="712" y="270" class="sm b">−</text>

  <!-- relay terminal block (small) -->
  <rect x="820" y="160" width="110" height="60" rx="6" fill="#1B5E20" stroke="#0B3D10" stroke-width="2"/>
  <circle cx="848" cy="180" r="10" fill="#B0BEC5"/><circle cx="902" cy="180" r="10" fill="#B0BEC5"/>
  <text x="848" y="238" text-anchor="middle" class="sm b">1</text>
  <text x="902" y="238" text-anchor="middle" class="sm b">2</text>
  <text x="875" y="148" text-anchor="middle" class="sm b" fill="#1B5E20">relay screw terminal</text>

  <!-- bulb -->
  <circle cx="1050" cy="196" r="34" fill="#FFF8E1" stroke="#FBC02D" stroke-width="3"/>
  <path d="M1036,224 L1064,224 L1060,244 L1040,244 z" fill="#B0BEC5" stroke="#78909C"/>
  <text x="1050" y="272" text-anchor="middle" class="sm b">bulb (3–6 V)</text>

  <!-- wires: + supply -> terminal 1 -->
  <path d="M706,196 L840,196 L840,192" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#arrR)"/>
  <!-- terminal 2 -> bulb -->
  <path d="M910,192 L910,196 L1014,196" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#arrR)"/>
  <!-- bulb -> supply minus -->
  <path d="M1050,248 L1050,330 L700,330 L700,272" fill="none" stroke="#263238" stroke-width="4" marker-end="url(#arrK)"/>

  <text x="567" y="366" class="lbl">The relay's two screws are simply <tspan class="b">an open switch</tspan>. Off = gap, bulb dark. On = joined, bulb lit.</text>

  <!-- ================= wiring table ================= -->
  <rect x="40" y="415" width="1100" height="175" rx="10" fill="#FFFFFF" stroke="#DDE4EA" stroke-width="1.5"/>
  <text x="62" y="443" class="hd">Three connections — that is all</text>

  <rect x="62" y="458" width="1056" height="34" fill="#F0F4F8"/>
  <text x="80"  y="481" class="lbl b">From</text>
  <text x="520" y="481" class="lbl b">To</text>
  <text x="850" y="481" class="lbl b">Wire colour by convention</text>

  <text x="80"  y="516" class="lbl">5 V supply  <tspan class="b" fill="#c62828">+</tspan></text>
  <text x="520" y="516" class="lbl">relay screw terminal <tspan class="b">1</tspan></text>
  <text x="850" y="516" class="lbl" fill="#c62828">red</text>

  <text x="80"  y="546" class="lbl">relay screw terminal <tspan class="b">2</tspan></text>
  <text x="520" y="546" class="lbl">bulb — either leg</text>
  <text x="850" y="546" class="lbl" fill="#c62828">red</text>

  <text x="80"  y="576" class="lbl">bulb — other leg</text>
  <text x="520" y="576" class="lbl">5 V supply  <tspan class="b">−</tspan></text>
  <text x="850" y="576" class="lbl">black</text>

  <!-- ================= grove side (context) ================= -->
  <rect x="40" y="612" width="540" height="150" rx="10" fill="#EAF2FB" stroke="#B9D3EF" stroke-width="1.5"/>
  <text x="62" y="640" class="hd">The other side of the relay (already wired)</text>
  <text x="62" y="668" class="lbl">SIG → Pi <tspan class="b">pin 11</tspan> (GPIO17)   ·   VCC → Pi <tspan class="b">pin 2</tspan> (5 V)   ·   GND → Pi <tspan class="b">pin 6</tspan></text>
  <text x="62" y="694" class="sm">This side is the Pi telling the relay when to close. Do not change it.</text>
  <text x="62" y="722" class="sm">The two sides are electrically <tspan class="b">isolated</tspan> — the bulb's power never touches the Pi,</text>
  <text x="62" y="742" class="sm">which is exactly why a relay is used and why no shared ground is needed.</text>

  <!-- ================= cautions ================= -->
  <rect x="600" y="612" width="540" height="150" rx="10" fill="#FFF8ED" stroke="#F0C98A" stroke-width="1.5"/>
  <text x="622" y="640" class="hd" fill="#8a5a00">Before you power it</text>
  <text x="622" y="668" class="lbl"><tspan class="b">·</tspan> Bulb must be rated <tspan class="b">3–6 V</tspan>. A mains bulb — do not.</text>
  <text x="622" y="692" class="lbl"><tspan class="b">·</tspan> Use a <tspan class="b">separate</tspan> 5 V supply, not the Pi's 5 V pin.</text>
  <text x="622" y="716" class="lbl"><tspan class="b">·</tspan> Bare wire ends only — trim any frayed strands first.</text>
  <text x="622" y="740" class="lbl"><tspan class="b">·</tspan> Pi shut down and supply unplugged while you wire.</text>

  <text x="590" y="800" text-anchor="middle" class="sm">If your jumper wires end in a plastic pin or socket, snip one end off and strip ~6 mm of insulation — the screw terminal needs bare wire.</text>
  <text x="590" y="822" text-anchor="middle" class="sm">A male pin pushed in and clamped also works, but bare copper grips far better.</text>
</svg>
